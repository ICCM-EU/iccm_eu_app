server {
    listen 80;
    server_name konferenz-api.ihrefirma.de 192.168.1.50;
    # Automatic redirection from HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name konferenz-api.ihrefirma.de 192.168.1.50;

    # Paths to your SSL certificates (e.g., from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/konferenz-api.ihrefirma.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konferenz-api.ihrefirma.de/privkey.pem;

    location / {
        # Forwarding to the local Node.js app
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}