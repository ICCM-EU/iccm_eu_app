<VirtualHost *:80>
    ServerName api.ihre-konferenz.de

    # Automatic redirection from HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.ihre-konferenz.de

    # SSL activation and paths to the Let's Encrypt certificate
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.ihre-konferenz.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.ihre-konferenz.de/privkey.pem

    # Proxy settings: Forwards requests to the Node.js backend on port 3000
    ProxyRequests Off
    ProxyPreserveHost On

    <Location />
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
    </Location>

    # Security addition: Prevents the server from being misused as an open proxy
    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>

    # Log files for eventual troubleshooting
    ErrorLog ${APACHE_LOG_DIR}/konferenz_api_error.log
    CustomLog ${APACHE_LOG_DIR}/konferenz_api_access.log combined
</VirtualHost>