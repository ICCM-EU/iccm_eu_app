<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/iccm_eu_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ICCM Europe App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ICCM Europe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ICCM Europe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #61b631;">
  <script src="firebase-config.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var reg = registrations[i];
            if (reg.active && reg.active.scriptURL.indexOf('notifications_service_worker.js') !== -1) {
              console.log('[Web] Unregistering conflicting flutter_local_notifications service worker:', reg.active.scriptURL);
              reg.unregister();
            }
          }
          navigator.serviceWorker.register('firebase-messaging-sw.js').then(function(reg) {
            console.log('[Web] Registered firebase-messaging-sw.js with scope:', reg.scope);
          }).catch(function(err) {
            console.error('[Web] Failed to register firebase-messaging-sw.js:', err);
          });
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
